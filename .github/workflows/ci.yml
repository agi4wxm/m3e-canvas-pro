# Every push and pull request: install from the lockfile, then the same checks the docs ask for before a commit.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Generated files are up to date
        run: |
          bun run check:icons
          bun run check:icon-sets
          bun run check:versions
          bun run check:rn
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      # the MCP server (mcp/): one Node bundle with the app build beside it, and it must start under plain Node
      - name: MCP server
        run: |
          bun run mcp:build
          node mcp/dist/m3e-canvas-mcp.js --help

  # The React Native kit (rn/): its own package and toolchain (Expo, Jest), checked as an exported mobile app is: types,
  # lint, the tests of every part and of the screens the printer wrote, a web build of its gallery and an Android bundle.
  rn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install the editor (the kit's data is written from it)
        run: bun install --frozen-lockfile
      - name: The kit's generated data is up to date
        run: bun run check:rn
      - name: Install rn/
        working-directory: rn
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: rn
        run: npm run typecheck
      - name: Lint
        working-directory: rn
        run: npm run lint
      - name: Test
        working-directory: rn
        run: npm test -- --ci
      - name: Web build of the gallery
        working-directory: rn
        run: npm run export:web
      - name: Android bundle (Metro)
        working-directory: rn
        run: npm run export:android

  # The editor itself in headless Chromium (e2e/*.e2e.ts): built, served with `vp preview`, driven by its own controls.
  # Playwright is not a dependency of the project; it is installed here, with its Chromium, and found through npm's root.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      # Outside the checkout: package.json names bun as its package manager (devEngines), and npm refuses to run there.
      - name: Playwright and Chromium
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: End-to-end tests
        run: bun run test:e2e
      - name: Screenshots of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e/.out

  # The whole-product export (lib/export): a fixture with an API contract exported as a monorepo, then for real npm
  # install, typecheck, lint, build (web and server), test, the contract tests against the built server, the app in
  # Chromium, and a second export over it that must keep custom code (scripts/check-product.ts).
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      # Outside the checkout: package.json names bun as its package manager (devEngines), and npm refuses to run there.
      - name: Playwright and Chromium
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Export a product and check it for real
        run: bun scripts/check-product.ts "${{ runner.temp }}/product"
      - name: Logs of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-logs
          path: ${{ runner.temp }}/product/*.log
